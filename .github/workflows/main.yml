name: Build ZLMediaKit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev libsdl2-dev

      - name: 编译
        run: |
          mkdir build && cd build
          cmake .. -DENABLE_WEBRTC=ON
          cmake --build . -j$(nproc)

      - name: 打包
        run: |
          mkdir dist
          cp build/release/linux/Release/MediaServer dist/
          tar -czf ZLMediaKit-linux.tar.gz -C dist .

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MediaServer
          path: ZLMediaKit-linux.tar.gz
